[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-harness"
version = "0.1.0"
description = "A Telegram health tracker where the LLM routes and extracts, and never computes."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rebronnikov" }]
dependencies = [
    # Tested against 1.3. The `output_config={"effort": ...}` parameter and the
    # `web_search_20260209` tool type that harness.py declares both need a recent SDK;
    # the old requirements.txt floor (>=0.40) was wrong rather than loose — a fresh
    # install at that version fails on both.
    "anthropic>=1.3,<2",
    # Built and run against 22.x (the old >=21 floor was likewise wrong).
    "python-telegram-bot>=22,<23",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
health-bot = "health.main:main"
health-cli = "health.cli:main"
health-seed = "health.seed_demo:main"

[tool.setuptools.packages.find]
include = ["health*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# Correctness only (pyflakes + the pycodestyle errors ruff enables by default). Line
# length is deliberately not enforced: the comments carry the reasoning, and a few
# long lines beat wrapping an argument mid-sentence.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# conftest sets DATA_DIR/DB_PATH in the environment BEFORE the first `health` import —
# that ordering is what keeps the suite off the real data directory, so its imports
# cannot be at the top of the file.
"tests/conftest.py" = ["E402"]
